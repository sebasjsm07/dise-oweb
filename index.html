<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <!-- ejercicio para alumnos (15min):
    crea una estructura, abrela en el navegador,
    observa como se ve sin ningun estilo -->


    <!-- encabezado:aqui empieza la semantica -->
    <header>
        <div>
            <h1>Empresa</h1>
            <nav> 
            <a href="#inicio">inicio</a>
            <a href="servicios">servicio</a>
            <a href="contacto">Contacto</a>
            </nav>
        </div>
    </header>

    <!-- seccion principal -->

<main>


    <!-- seccion agrupa contenido tematico -->
<section id="inicio">
    <h2>Bienvenidos</h2>
    <p>Somos una empresa dedicada a crear soluciones digitales</p>
    <button>Ver mas</button>
    <button>Contactar</button>
</section>

<!-- seccion de servicios -->
<section id="servicios">
<h2>Nuestros servicios</h2>


<!-- articulo:contenido independiente y reutilizable -->
<article>
<h3>Diseños web</h3>
<p>Creamos sitios modernos y funcionales</p>
</article>

<article>
<h3>Desarrollo</h3>
<p>Programamos aplicaciones a medida</p>
</article>

<article>
<h3>Marketing</h3>
<p>Aumentamos tu prescencia digital</p>
</article>
</section>

        <!-- SECCIÓN DE CONTACTO -->
        <section id="contacto">
            <h2>Contacto</h2>
            <form>
                <div>
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" placeholder="Tu nombre">
                </div>
                <div>
                    <label for="email">Email:</label>
                    <input type="email" id="email" placeholder="tu@email.com">
                </div>
                <button type="submit">Enviar</button>
            </form>
        </section>
</main>


  <!-- PIE DE PÁGINA -->
    <footer>
        <p>© 2024 Mi Empresa</p>
    </footer>

</body>
</html>
